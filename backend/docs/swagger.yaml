basePath: /
definitions:
  server.CreateKaucjomatRequest:
    properties:
      address:
        type: string
      current_status:
        type: string
      description:
        type: string
      latitude:
        type: number
      longitude:
        type: number
      name:
        type: string
      opening_hours:
        type: string
      type:
        type: string
    type: object
  server.CreateUserHandler.parameters:
    properties:
      email:
        type: string
      password:
        type: string
      username:
        type: string
    type: object
  server.LoginUserHandler.parameters:
    properties:
      password:
        type: string
      username:
        type: string
    type: object
  server.MapPoint:
    properties:
      bg_color:
        type: string
      latitude:
        type: number
      longitude:
        type: number
      return_point_id:
        type: string
      short_name:
        type: string
      text_color:
        type: string
    type: object
  server.UpdateKaucjomatHandler.UpdateKaucjomatRequest:
    properties:
      address:
        type: string
      can:
        type: boolean
      description:
        type: string
      glass:
        type: boolean
      latitude:
        type: number
      longitude:
        type: number
      name:
        type: string
      opening_hours:
        type: string
      pet:
        type: boolean
      type:
        type: string
    type: object
  server.User:
    properties:
      created_at:
        type: string
      email:
        type: string
      id:
        type: string
      is_admin:
        type: boolean
      is_banned:
        type: boolean
      reputation:
        type: integer
      token:
        type: string
      updated_at:
        type: string
      username:
        type: string
    type: object
host: localhost:3000
info:
  contact:
    email: support@kaucjomapa.pl
    name: Wsparcie Techniczne
  description: To jest serwer API dla aplikacji KaucjoMapa.
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: KaucjoMapa API
  version: "1.0"
paths:
  /:
    get:
      description: Zwraca prostą wiadomość potwierdzającą, że API działa.
      produces:
        - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Sprawdzenie działania API
      tags:
        - health
  /auth/google:
    get:
      description: Generuje state i PKCE, a następnie przekierowuje do Google OAuth2.
      responses:
        "302":
          description: Found
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Logowanie przez Google
      tags:
        - auth
  /auth/google/callback:
    get:
      description:
        Weryfikuje odpowiedź Google, tworzy lub łączy konto i zwraca użytkownika
        z lokalnym JWT.
      parameters:
        - description: Authorization code
          in: query
          name: code
          required: true
          type: string
        - description: OAuth state
          in: query
          name: state
          required: true
          type: string
      produces:
        - application/json
      responses:
        "200":
          description: OK
          headers:
            Set-Cookie:
              description: RefreshToken
              type: string
          schema:
            $ref: "#/definitions/server.User"
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Callback Google OAuth2
      tags:
        - auth
  /auth/revoke:
    post:
      description:
        Weryfikuje access token z nagłówka Authorization i unieważnia refresh
        token przekazany w cookie.
      parameters:
        - description: Bearer access token
          in: header
          name: Authorization
          required: true
          type: string
        - description: RefreshToken=<refresh_token>
          in: header
          name: Cookie
          required: true
          type: string
      produces:
        - application/json
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Unieważnienie refresh tokenu
      tags:
        - auth
  /auth/token:
    post:
      description:
        Weryfikuje access token z nagłówka Authorization i refresh token
        z cookie, a następnie zwraca nowy access token.
      parameters:
        - description: Bearer access token
          in: header
          name: Authorization
          required: true
          type: string
        - description: RefreshToken=<refresh_token>
          in: header
          name: Cookie
          required: true
          type: string
      produces:
        - application/json
      responses:
        "200":
          description: Nowy access token
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Brak, nieprawidłowy lub wygasły token
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Błąd generowania access tokenu
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Odświeżenie tokenu JWT
      tags:
        - auth
  /kaucjomaty:
    get:
      description: Zwraca punkty zwrotu do wyświetlenia na mapie.
      parameters:
        - description: Typ punktu
          enum:
            - butelkomat
            - sklep
            - punkt_skupu
            - inny
          in: query
          name: type
          type: string
        - description: Status punktu
          enum:
            - dostepny
            - zapelniony
            - nieczynny
            - awaria
            - brak_informacji
            - do_weryfikacji
          in: query
          name: status
          type: string
      produces:
        - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: "#/definitions/server.MapPoint"
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Lista kaucjomatów
      tags:
        - kaucjomaty
    post:
      consumes:
        - application/json
      description: |-
        Tworzy nowy punkt zwrotu/kaucjomat dla zalogowanego użytkownika.
        Dozwolone wartości type: butelkomat, sklep, punkt_skupu, inny.
        Dozwolone wartości current_status: dostepny, zapelniony, nieczynny, awaria, brak_informacji, do_weryfikacji.
      parameters:
        - description: Bearer access token
          in: header
          name: Authorization
          required: true
          type: string
        - description: Dane kaucjomatu
          in: body
          name: request
          required: true
          schema:
            $ref: "#/definitions/server.CreateKaucjomatRequest"
      produces:
        - application/json
      responses:
        "200":
          description: Utworzony kaucjomat
          schema:
            $ref: "#/definitions/server.MapPoint"
        "400":
          description: Nieprawidłowe dane wejściowe
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Brak lub nieprawidłowy access token
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Błąd serwera
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Dodanie kaucjomatu
      tags:
        - kaucjomaty
  /kaucjomaty/{id}:
    delete:
      description: Usuwa punkt zwrotu. Operacja jest dostępna wyłącznie dla administratora.
      parameters:
        - description: Bearer access token
          in: header
          name: Authorization
          required: true
          type: string
        - description: Identyfikator kaucjomatu
          format: uuid
          in: path
          name: id
          required: true
          type: string
      produces:
        - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Nieprawidłowy identyfikator kaucjomatu
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Brak lub nieprawidłowy access token
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Użytkownik nie jest administratorem
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Błąd serwera
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Usunięcie kaucjomatu
      tags:
        - kaucjomaty
    put:
      consumes:
        - application/json
      description: Aktualizuje dane punktu zwrotu dla zalogowanego użytkownika.
      parameters:
        - description: Bearer access token
          in: header
          name: Authorization
          required: true
          type: string
        - description: Identyfikator kaucjomatu
          format: uuid
          in: path
          name: id
          required: true
          type: string
        - description: Dane kaucjomatu
          in: body
          name: request
          required: true
          schema:
            $ref: "#/definitions/server.UpdateKaucjomatHandler.UpdateKaucjomatRequest"
      produces:
        - application/json
      responses:
        "200":
          description: Zaktualizowany kaucjomat
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Nieprawidłowy identyfikator lub body
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Brak lub nieprawidłowy access token
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Nie znaleziono kaucjomatu lub błąd serwera
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Aktualizacja kaucjomatu
      tags:
        - kaucjomaty
  /login:
    post:
      consumes:
        - application/json
      description:
        Weryfikuje dane logowania, zwraca dane użytkownika z access tokenem
        i zapisuje refresh token w cookie.
      parameters:
        - description: Dane logowania
          in: body
          name: request
          required: true
          schema:
            $ref: "#/definitions/server.LoginUserHandler.parameters"
      produces:
        - application/json
      responses:
        "200":
          description: OK
          headers:
            Set-Cookie:
              description: RefreshToken=<token>; Path=/auth; HttpOnly; SameSite=Strict
              type: string
          schema:
            $ref: "#/definitions/server.User"
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Logowanie użytkownika
      tags:
        - auth
  /users:
    post:
      consumes:
        - application/json
      description: Tworzy nowe konto użytkownika i zwraca dane utworzonego użytkownika.
      parameters:
        - description: Dane rejestracji użytkownika
          in: body
          name: request
          required: true
          schema:
            $ref: "#/definitions/server.CreateUserHandler.parameters"
      produces:
        - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: "#/definitions/server.User"
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Rejestracja użytkownika
      tags:
        - users
swagger: "2.0"
