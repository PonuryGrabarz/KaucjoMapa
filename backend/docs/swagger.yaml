        in: query
        name: pet
        type: boolean
      - description: Czy punkt przyjmuje puszki
        in: query
        name: can
        type: boolean
      - description: Czy punkt przyjmuje szkło
        in: query
        name: glass
        type: boolean
      - description: Metody rozliczenia rozdzielone przecinkami
        example: gotowka,karta
        in: query
        name: refund_method
        type: string
      - default: 1
        description: Numer strony
        in: query
        minimum: 1
        name: page
        type: integer
