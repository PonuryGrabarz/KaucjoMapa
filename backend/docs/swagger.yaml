basePath: /api
consumes:
- application/json
definitions:
  presenter.CreateReturnPointRequest:
    properties:
      address:
        type: string
      can:
        type: boolean
      current_status:
        enum:
        - dostepny
        - zapelniony
        - nieczynny
        - awaria
        - brak_informacji
        - do_weryfikacji
        type: string
      description:
        type: string
      glass:
        type: boolean
      latitude:
        type: number
      longitude:
        type: number
      name:
        type: string
      opening_hours:
        type: string
      pet:
        type: boolean
      type:
        enum:
        - butelkomat
        - sklep
        - punkt_skupu
        - inny
        type: string
    type: object
  presenter.CreateUserRequest:
    properties:
      email:
        type: string
      password:
        minLength: 8
        type: string
      username:
        type: string
    required:
    - email
    - password
    - username
    type: object
  presenter.ErrorResponse:
    properties:
      error:
        example: Invalid request body
        type: string
    type: object
  presenter.LoginRequest:
    properties:
      password:
        type: string
      username:
        type: string
    type: object
  presenter.ReturnPointDetailsResponse:
    properties:
      address:
        type: string
      can:
        type: boolean
      created_at:
        type: string
      current_status:
        enum:
        - dostepny
        - zapelniony
        - nieczynny
        - awaria
        - brak_informacji
        - do_weryfikacji
        type: string
      description:
        type: string
      glass:
        type: boolean
      id:
        format: uuid
        type: string
      is_verified:
        type: boolean
      latitude:
        type: number
      longitude:
        type: number
      name:
        type: string
      opening_hours:
        type: string
      pet:
        type: boolean
      type:
        enum:
        - butelkomat
        - sklep
        - punkt_skupu
        - inny
        type: string
      updated_at:
        type: string
      user_id:
        format: uuid
        type: string
    type: object
  presenter.ReturnPointPage:
    properties:
      max_page:
        type: integer
      return_points:
        items:
          $ref: '#/definitions/presenter.ReturnPointResponse'
        type: array
    type: object
  presenter.ReturnPointResponse:
    properties:
      Longitude:
        type: number
      address:
        type: string
      bg_color:
        type: string
      can:
        type: boolean
      current_status:
        enum:
        - dostepny
        - zapelniony
        - nieczynny
        - awaria
        - brak_informacji
        - do_weryfikacji
        type: string
      description:
        type: string
      glass:
        type: boolean
      id:
        format: uuid
        type: string
      latitude:
        type: number
      name:
        type: string
      opening_hours:
        type: string
      pet:
        type: boolean
      short_name:
        type: string
      text_color:
        type: string
    type: object
  presenter.TokenResponse:
    properties:
      token:
        type: string
    type: object
  presenter.UpdateKaucjomatRequest:
    properties:
      address:
        type: string
      can:
        type: boolean
      description:
        type: string
      glass:
        type: boolean
      latitude:
        type: number
      longitude:
        type: number
      name:
        type: string
      opening_hours:
        type: string
      pet:
        type: boolean
      type:
        enum:
        - butelkomat
        - sklep
        - punkt_skupu
        - inny
        type: string
    type: object
host: localhost:3000
info:
  contact:
    email: support@kaucjomapa.pl
    name: Wsparcie techniczne
  description: API do wyszukiwania i zarządzania punktami zwrotu opakowań kaucyjnych.
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  title: KaucjoMapa API
  version: "1.0"
paths:
  /auth/revoke:
    post:
      description: Unieważnia refresh token przekazany w cookie.
      parameters:
      - description: Cookie w formacie RefreshToken=<token>
        in: header
        name: Cookie
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "401":
          description: Brak lub nieprawidłowy access albo refresh token
          schema:
            $ref: '#/definitions/presenter.ErrorResponse'
        "500":
          description: Wewnętrzny błąd serwera
          schema:
            $ref: '#/definitions/presenter.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Unieważnij refresh token
      tags:
      - auth
  /auth/token:
    post:
      description: Generuje nowy access token na podstawie Bearer JWT i cookie RefreshToken.
      parameters:
      - description: Cookie w formacie RefreshToken=<token>
        in: header
        name: Cookie
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Nowy access token
          schema:
            $ref: '#/definitions/presenter.TokenResponse'
        "401":
          description: Brak lub nieprawidłowy access albo refresh token
          schema:
            $ref: '#/definitions/presenter.ErrorResponse'
        "500":
          description: Wewnętrzny błąd serwera
          schema:
            $ref: '#/definitions/presenter.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Odśwież access token
      tags:
      - auth
  /login:
    post:
      consumes:
      - application/json
      description: Weryfikuje dane logowania, zwraca access token i ustawia cookie
        RefreshToken.
      parameters:
      - description: Dane logowania
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/presenter.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Access token
          headers:
            Set-Cookie:
              description: Cookie RefreshToken; Path=/api/auth; HttpOnly; Secure;
                SameSite=Strict
              type: string
          schema:
            $ref: '#/definitions/presenter.TokenResponse'
        "400":
          description: Nieprawidłowe body żądania
          schema:
            $ref: '#/definitions/presenter.ErrorResponse'
        "401":
          description: Nieprawidłowa nazwa użytkownika lub hasło
          schema:
            $ref: '#/definitions/presenter.ErrorResponse'
        "500":
          description: Wewnętrzny błąd serwera
          schema:
            $ref: '#/definitions/presenter.ErrorResponse'
      summary: Zaloguj użytkownika
      tags:
      - auth
  /return_points:
    get:
      description: Zwraca punkty zwrotu filtrowane po typie, statusie i wyszukiwanej
        frazie.
      parameters:
      - description: Typ punktu
        enum:
        - butelkomat
        - sklep
        - punkt_skupu
        - inny
        in: query
        name: type
        type: string
      - description: Status punktu
        enum:
        - dostepny
        - zapelniony
        - nieczynny
        - awaria
        - brak_informacji
        - do_weryfikacji
        in: query
        name: status
        type: string
      - description: Fragment nazwy lub adresu
        in: query
        name: query
        type: string
      - default: 1
        description: Numer strony
        in: query
        minimum: 1
        name: page
        type: integer
      - default: 10
        description: Liczba elementów na stronie
        in: query
        minimum: 1
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Strona punktów zwrotu
          schema:
            $ref: '#/definitions/presenter.ReturnPointPage'
        "400":
          description: Nieprawidłowy numer lub rozmiar strony
          schema:
            $ref: '#/definitions/presenter.ErrorResponse'
        "500":
          description: Nie udało się pobrać punktów zwrotu
          schema:
            $ref: '#/definitions/presenter.ErrorResponse'
      summary: Pobierz punkty zwrotu
      tags:
      - return-points
    post:
      consumes:
      - application/json
      description: Tworzy punkt zwrotu przypisany do zalogowanego użytkownika.
      parameters:
      - description: Dane punktu zwrotu
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/presenter.CreateReturnPointRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Utworzony punkt zwrotu
          schema:
            $ref: '#/definitions/presenter.ReturnPointResponse'
        "400":
          description: Nieprawidłowe body żądania
          schema:
            $ref: '#/definitions/presenter.ErrorResponse'
        "401":
          description: Brak lub nieprawidłowy access token
          schema:
            $ref: '#/definitions/presenter.ErrorResponse'
        "500":
          description: Nie udało się utworzyć punktu zwrotu
          schema:
            $ref: '#/definitions/presenter.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Dodaj punkt zwrotu
      tags:
      - return-points
  /return_points/{id}:
    delete:
      description: Usuwa punkt zwrotu. Operacja jest dostępna tylko dla administratora.
      parameters:
      - description: Identyfikator punktu
        format: uuid
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Nieprawidłowy identyfikator punktu
          schema:
            $ref: '#/definitions/presenter.ErrorResponse'
        "401":
          description: Brak lub nieprawidłowy access token
          schema:
            $ref: '#/definitions/presenter.ErrorResponse'
        "500":
          description: Nie udało się usunąć punktu zwrotu
          schema:
            $ref: '#/definitions/presenter.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Usuń punkt zwrotu
      tags:
      - return-points
    put:
      consumes:
      - application/json
      description: Częściowo aktualizuje dane istniejącego punktu zwrotu.
      parameters:
      - description: Identyfikator punktu
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: Pola do aktualizacji
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/presenter.UpdateKaucjomatRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Zaktualizowany punkt zwrotu
          schema:
            $ref: '#/definitions/presenter.ReturnPointDetailsResponse'
        "400":
          description: Nieprawidłowy identyfikator lub body żądania
          schema:
            $ref: '#/definitions/presenter.ErrorResponse'
        "401":
          description: Brak lub nieprawidłowy access token
          schema:
            $ref: '#/definitions/presenter.ErrorResponse'
        "500":
          description: Nie udało się pobrać użytkownika lub zaktualizować punktu
          schema:
            $ref: '#/definitions/presenter.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Zaktualizuj punkt zwrotu
      tags:
      - return-points
  /users:
    post:
      consumes:
      - application/json
      description: Tworzy konto użytkownika i zwraca access token.
      parameters:
      - description: Dane nowego użytkownika
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/presenter.CreateUserRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Access token
          schema:
            $ref: '#/definitions/presenter.TokenResponse'
        "400":
          description: Nieprawidłowe body żądania
          schema:
            $ref: '#/definitions/presenter.ErrorResponse'
        "500":
          description: Nie udało się utworzyć użytkownika
          schema:
            $ref: '#/definitions/presenter.ErrorResponse'
      summary: Zarejestruj użytkownika
      tags:
      - users
produces:
- application/json
schemes:
- https
securityDefinitions:
  BearerAuth:
    description: 'Wartość w formacie: Bearer <JWT>'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
