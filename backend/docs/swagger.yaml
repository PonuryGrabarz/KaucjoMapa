basePath: /
definitions:
  server.CreateUserHandler.parameters:
    properties:
      email:
        type: string
      password:
        type: string
      username:
        type: string
    type: object
  server.LoginUserHandler.parameters:
    properties:
      password:
        type: string
      username:
        type: string
    type: object
  server.MapPoint:
    properties:
      bg_color:
        type: string
      latitude:
        type: number
      longitude:
        type: number
      return_point_id:
        type: string
      short_name:
        type: string
      text_color:
        type: string
    type: object
  server.User:
    properties:
      created_at:
        type: string
      email:
        type: string
      id:
        type: string
      is_admin:
        type: boolean
      is_banned:
        type: boolean
      refresh_token:
        type: string
      reputation:
        type: integer
      token:
        type: string
      updated_at:
        type: string
      username:
        type: string
    type: object
host: localhost:3000
info:
  contact:
    email: support@kaucjomapa.pl
    name: Wsparcie Techniczne
  description: To jest serwer API dla aplikacji KaucjoMapa.
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: KaucjoMapa API
  version: "1.0"
paths:
  /:
    get:
      description: Zwraca prostą wiadomość potwierdzającą, że API działa.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Sprawdzenie działania API
      tags:
      - health
  /auth/revoke:
    post:
      description: Unieważnia refresh token przekazany w nagłówku Authorization Bearer.
      parameters:
      - description: Bearer refresh_token
        in: header
        name: Authorization
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Unieważnienie refresh tokenu
      tags:
      - auth
  /auth/token:
    post:
      description: Przyjmuje refresh token w nagłówku Authorization Bearer i zwraca
        nowy token JWT.
      parameters:
      - description: Bearer refresh_token
        in: header
        name: Authorization
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Odświeżenie tokenu JWT
      tags:
      - auth
  /kaucjomaty:
    get:
      description: Zwraca punkty zwrotu do wyświetlenia na mapie.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/server.MapPoint'
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Lista kaucjomatów
      tags:
      - kaucjomaty
    post:
      consumes:
      - application/json
      description: Przyjmuje dane punktu zwrotu do dodania.
      parameters:
      - description: Dane kaucjomatu
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/server.MapPoint'
      responses:
        "200":
          description: OK
      summary: Dodanie kaucjomatu
      tags:
      - kaucjomaty
  /login:
    post:
      consumes:
      - application/json
      description: Weryfikuje dane logowania i zwraca dane użytkownika z tokenem JWT
        oraz tokenem odświeżającym.
      parameters:
      - description: Dane logowania
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/server.LoginUserHandler.parameters'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/server.User'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Logowanie użytkownika
      tags:
      - auth
  /users:
    post:
      consumes:
      - application/json
      description: Tworzy nowe konto użytkownika i zwraca dane utworzonego użytkownika.
      parameters:
      - description: Dane rejestracji użytkownika
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/server.CreateUserHandler.parameters'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/server.User'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Rejestracja użytkownika
      tags:
      - users
swagger: "2.0"
