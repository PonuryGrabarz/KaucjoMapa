server {
    listen 80;
    listen [::]:80;
    server_name kaucjo-mapa.pl;

    return 308 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    listen 443 quic reuseport;
    listen [::]:443 quic reuseport;
    http2 on;
    http3 on;

    server_name kaucjo-mapa.pl;

    ssl_certificate /etc/nginx/local-certs/kaucjo-mapa.crt;
    ssl_certificate_key /etc/nginx/local-certs/kaucjo-mapa.key;
    include conf.d/include/ssl-cache.conf;
    include conf.d/include/ssl-ciphers.conf;

    add_header Alt-Svc 'h3=":443"; ma=86400' always;

    access_log /data/logs/kaucjo-mapa_access.log proxy;
    error_log /data/logs/kaucjo-mapa_error.log warn;

    location /api/ {
        proxy_pass https://host.docker.internal:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_verify off;
    }

    location / {
        proxy_pass http://host.docker.internal:4321;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
