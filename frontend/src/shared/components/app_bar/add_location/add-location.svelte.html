<div class="add-location">
	<Button class="add-location__button" variant="tonal" onclick={handleAddLocation}>
		<IconifyIcon icon={ADD_LOCATION_ICON} size={20} />

		<span>Dodaj punkt</span>
	</Button>

	<IconButton
		class="add-location__icon-button"
		icon={ADD_LOCATION_ICON}
		aria-label="Dodaj punkt"
		iconSize={20}
		onclick={handleAddLocation}
	/>

	<span class="add-location__divider" aria-hidden="true"></span>
</div>
