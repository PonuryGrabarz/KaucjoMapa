name: kaucjomapa

services:
  nginx-proxy-manager:
    image: jc21/nginx-proxy-manager:2.15.1
    restart: unless-stopped
    ports:
      - "80:80/tcp"
      - "443:443/tcp"
      - "443:443/udp"
      - "127.0.0.1:81:81/tcp"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      TZ: Europe/Warsaw
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
    volumes:
      - nginx_proxy_manager_data:/data
      - nginx_proxy_manager_letsencrypt:/etc/letsencrypt
      - ./docker/nginx-proxy-manager/custom:/data/nginx/custom
      - ./.docker/nginx-proxy-manager/certs:/etc/nginx/local-certs:ro
    healthcheck:
      test: ["CMD", "/usr/bin/check-health"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s

networks:
  default:
    driver_opts:
      com.docker.network.bridge.name: kaucjomapa0

volumes:
  nginx_proxy_manager_data:
  nginx_proxy_manager_letsencrypt:
